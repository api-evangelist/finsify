name: Finsify
description: >-
  Finsify is a Southeast Asian bank-data aggregation company whose Finsify Hub
  service exposes a RESTful API for accessing end-user banking data — account
  balances and status, and categorized transaction history — across 50+ bank and
  statement services in 15 countries. The API handles customer creation,
  short-lived connection tokens that drive the end-user bank-login flow, account
  retrieval, transaction history filtered by date range, and login lifecycle
  management (activate, deactivate, refresh, reconnect), with machine-learning
  transaction categorization and webhook notifications for new transactions and
  login-status changes. Finsify is a 500 Global portfolio company and powers
  fintech products including Money Lover, Money Paper, Ngan Luong, and Bao Kim.
